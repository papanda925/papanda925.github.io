<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>スマホ学習モード｜4択 解答チェックシート</title>
  <meta name="description" content="4択解答チェックシートのスマホ学習モード。ストップウォッチと画面オン維持に対応。">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://papanda925.github.io/mental-health-answer-sheet/mobile.html">
  <style>
    :root{--bg:#f4f7fb;--surface:#fff;--text:#18212f;--muted:#667085;--line:#dfe5ec;--accent:#2563eb;--ok:#15803d;--warn:#9a6700;--bad:#b42318;--shadow:0 4px 14px rgba(31,41,55,.10)}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    body{min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    button{font:inherit;cursor:pointer}
    .tools{z-index:10;background:rgba(255,255,255,.98);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:max(5px,env(safe-area-inset-top)) 8px 6px}
    .bar{display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:center}
    .timer{font-variant-numeric:tabular-nums;font-size:1.28rem;line-height:1;font-weight:900;letter-spacing:.02em;white-space:nowrap;padding:0 4px}
    .controls{display:flex;gap:5px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:6px 8px;font-size:.74rem;font-weight:800;min-height:32px;white-space:nowrap}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.on{background:#ecfdf3;border-color:#86d6a0;color:var(--ok)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .statusline{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:4px;min-height:16px}
    .label{font-size:.69rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .wake-ok{color:var(--ok)}.wake-warn{color:var(--warn)}.wake-bad{color:var(--bad)}
    .frame-wrap{flex:1;min-height:0;background:#fff}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .tools.collapsed .statusline{display:none}
    .tools.collapsed{padding-bottom:5px}
    @media(max-width:390px){
      .bar{grid-template-columns:1fr}
      .timer{text-align:center;font-size:1.22rem}
      .controls{justify-content:center}
      .btn{padding:5px 7px;font-size:.71rem;min-height:30px}
    }
  </style>
</head>
<body>
  <section class="tools" id="tools" aria-label="学習ツール">
    <div class="bar">
      <div class="timer" id="timer">00:00:00</div>
      <div class="controls">
        <button class="btn primary" id="startBtn" type="button">開始</button>
        <button class="btn" id="pauseBtn" type="button">一時停止</button>
        <button class="btn" id="resetBtn" type="button">リセット</button>
        <button class="btn" id="wakeBtn" type="button">画面ON</button>
        <button class="btn" id="settingsBtn" type="button">設定</button>
        <button class="btn" id="hideBtn" type="button">▲</button>
      </div>
    </div>
    <div class="statusline">
      <span class="label">ストップウォッチ / 画面オン維持</span>
      <span class="label" id="wakeStatus">画面オン維持：OFF</span>
    </div>
  </section>

  <div class="frame-wrap">
    <iframe id="answerFrame" src="./" title="4択 解答チェックシート"></iframe>
  </div>

<script>
(() => {
  const timerEl=document.getElementById('timer');
  const startBtn=document.getElementById('startBtn');
  const pauseBtn=document.getElementById('pauseBtn');
  const resetBtn=document.getElementById('resetBtn');
  const wakeBtn=document.getElementById('wakeBtn');
  const settingsBtn=document.getElementById('settingsBtn');
  const hideBtn=document.getElementById('hideBtn');
  const wakeStatus=document.getElementById('wakeStatus');
  const tools=document.getElementById('tools');
  const frame=document.getElementById('answerFrame');

  let elapsed=0;
  let startedAt=null;
  let raf=null;
  const format=(ms)=>{
    const total=Math.floor(ms/1000);
    const h=Math.floor(total/3600),m=Math.floor((total%3600)/60),s=total%60;
    return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
  };
  const current=()=>elapsed+(startedAt===null?0:Date.now()-startedAt);
  const paint=()=>{
    timerEl.textContent=format(current());
    if(startedAt!==null) raf=requestAnimationFrame(paint);
  };
  startBtn.addEventListener('click',()=>{
    if(startedAt!==null)return;
    startedAt=Date.now();
    startBtn.textContent='計測中';
    startBtn.disabled=true;
    paint();
  });
  pauseBtn.addEventListener('click',()=>{
    if(startedAt===null)return;
    elapsed+=Date.now()-startedAt;
    startedAt=null;
    if(raf)cancelAnimationFrame(raf);
    timerEl.textContent=format(elapsed);
    startBtn.textContent='再開';
    startBtn.disabled=false;
  });
  resetBtn.addEventListener('click',()=>{
    elapsed=0;startedAt=null;
    if(raf)cancelAnimationFrame(raf);
    timerEl.textContent='00:00:00';
    startBtn.textContent='開始';startBtn.disabled=false;
  });

  let wakeLock=null,wakeWanted=false;
  const supported='wakeLock' in navigator;
  const setWakeUi=(kind,msg)=>{
    wakeStatus.className='label'+(kind?' wake-'+kind:'');
    wakeStatus.textContent=msg;
    const active=!!wakeLock&&!wakeLock.released;
    wakeBtn.classList.toggle('on',active);
    wakeBtn.textContent=active?'画面ON中':'画面ON';
  };
  const requestWake=async()=>{
    if(!supported){setWakeUi('warn','画面オン維持：未対応');return;}
    try{
      wakeLock=await navigator.wakeLock.request('screen');
      wakeWanted=true;
      setWakeUi('ok','画面オン維持：有効');
      wakeLock.addEventListener('release',()=>{
        wakeLock=null;
        if(wakeWanted)setWakeUi('warn','画面オン維持：一時解除');
        else setWakeUi('','画面オン維持：OFF');
      });
    }catch(e){wakeLock=null;setWakeUi('bad','画面オン維持：有効化できません');}
  };
  const releaseWake=async()=>{
    wakeWanted=false;
    try{if(wakeLock&&!wakeLock.released)await wakeLock.release();}catch{}
    wakeLock=null;setWakeUi('','画面オン維持：OFF');
  };
  wakeBtn.addEventListener('click',()=>wakeWanted?releaseWake():requestWake());
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState==='visible'&&wakeWanted&&(!wakeLock||wakeLock.released))await requestWake();
  });
  if(!supported){wakeBtn.disabled=true;setWakeUi('warn','画面オン維持：未対応');}

  let collapsed=false;
  hideBtn.addEventListener('click',()=>{
    collapsed=!collapsed;
    tools.classList.toggle('collapsed',collapsed);
    hideBtn.textContent=collapsed?'▼':'▲';
  });

  let settingsVisible=false;
  const applyMobileLayout=()=>{
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      const cards=doc.querySelectorAll('main > .card');
      if(cards[0])cards[0].classList.add('mobile-settings-card');
      if(cards[1])cards[1].classList.add('mobile-answer-card');
      const style=doc.createElement('style');
      style.id='mobile-wrapper-style';
      style.textContent=`
        .topbar,.hero,footer{display:none!important}
        body{background:#fff!important}
        main.wrap{width:100%!important;margin:0!important;padding:0 6px 12px!important}
        .mobile-settings-card{display:none!important;margin:4px 0 8px!important;padding:10px!important;box-shadow:none!important}
        body.mobile-show-settings .mobile-settings-card{display:block!important}
        .mobile-answer-card{margin:4px 0 8px!important;padding:10px!important;box-shadow:none!important;border-radius:12px!important}
        .mobile-answer-card h2{font-size:1.18rem!important;margin:0 0 8px!important}
        .modebar{margin:4px 0 8px!important;gap:5px!important}
        .tab,.setbtn,.filterbtn{padding:7px 9px!important;font-size:.82rem!important}
        .legend{margin:6px 0!important;font-size:.74rem!important}
        .rows{gap:7px!important}
        .qrow{padding:8px!important;border-radius:11px!important}
        .choice{min-height:48px!important;font-size:1.08rem!important}
        .qtools{margin-top:2px!important}
      `;
      const old=doc.getElementById('mobile-wrapper-style');
      if(old)old.remove();
      doc.head.appendChild(style);
      doc.body.classList.toggle('mobile-show-settings',settingsVisible);
    }catch(e){}
  };
  frame.addEventListener('load',()=>setTimeout(applyMobileLayout,50));
  settingsBtn.addEventListener('click',()=>{
    settingsVisible=!settingsVisible;
    settingsBtn.classList.toggle('on',settingsVisible);
    settingsBtn.textContent=settingsVisible?'設定を閉じる':'設定';
    applyMobileLayout();
  });
})();
</script>
</body>
</html>
